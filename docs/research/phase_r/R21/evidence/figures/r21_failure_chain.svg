<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490">
<rect width="100%" height="100%" fill="#fff"/>
<text x="45.0" y="36.0" text-anchor="start" font-family="Arial,sans-serif" font-size="21" fill="#222">Observed R21 causal chain (single frozen geometry and two seeds)</text>
<rect x="40" y="105" width="190" height="110" rx="4" fill="#f7f8fa" stroke="#444"/>
<text x="52.0" y="133.0" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#222">A0 / B / Known</text>
<text x="52.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#444">paired input intervention</text>
<rect x="295" y="105" width="210" height="110" rx="4" fill="#f7f8fa" stroke="#444"/>
<text x="307.0" y="133.0" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#222">F1/F2 input</text>
<text x="307.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#444">B mismatch; Known closes</text>
<rect x="570" y="105" width="200" height="110" rx="4" fill="#f7f8fa" stroke="#444"/>
<text x="582.0" y="133.0" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#222">CSI / CFAR</text>
<text x="582.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#444">SCNR proxy varies by seed</text>
<rect x="835" y="105" width="205" height="110" rx="4" fill="#f7f8fa" stroke="#444"/>
<text x="847.0" y="133.0" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#222">Detection</text>
<text x="847.0" y="158.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#444">B below A0; Known returns</text>
<path d="M 230 160 H 287 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 505 160 H 562 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/>
<path d="M 770 160 H 827 l -8 -5 m 8 5 l -8 5" fill="none" stroke="#555" stroke-width="2"/>
<text x="45.0" y="265.0" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#222">Input closure and correct target hits</text>
<text x="60.0" y="296.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#333">B(+4 ns): ON F2 RMS 0.328; hits 1/3 vs A0 2/3</text>
<text x="60.0" y="321.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#333">B(+4 ns): ON F2 RMS 0.329; hits 0/3 vs A0 2/3</text>
<text x="60.0" y="346.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#333">Known: ON F2 RMS 8.8e-05; hits 2/3</text>
<text x="60.0" y="371.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#333">Known: ON F2 RMS 8.8e-05; hits 2/3</text>
<text x="45.0" y="405.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" fill="#222">Blind estimators recover hit counts in this pilot, but do not close to Known.</text>
<text x="45.0" y="432.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" fill="#555">Output SCNR proxy and adaptive CSI transfer do not explain the detection pattern consistently.</text>
<text x="45.0" y="459.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#555">Causal interpretation is limited to this controlled +4 ns scenario; two seeds are feasibility evidence only.</text>
</svg>